---
- name: Create user accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default(omit) }}"
  loop: "{{ users }}"

- name: Add all authorized keys for each user
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
    manage_dir: true
  loop: "{{ users | subelements('authorized_keys', skip_missing=True) }}"
  loop_control:
    label: >-
      {{ item.0.name }},
      {{ (item.1.split()|length > 2) | ternary(item.1.split()|last,
      (item.1 | regex_replace('^(.{32}).*$', '\1…'))) }}
